# Docker Compose Override File Example
# ===========================================
# Personal overrides kept outside the shared docker-compose.yml so each user
# can customize their environment without touching the shared configuration.
#
# SETUP INSTRUCTIONS:
# 1. Copy this file to: docker-compose.override.yml
#    cp docker-compose.override.example.yml docker-compose.override.yml
#
# 2. The docker-compose.override.yml file is gitignored and will not be committed
#
# 3. Restart your devcontainer for changes to take effect
#
# NOTE: The full home directory (~) is already mounted in docker-compose.yml,
# so shell configs, SSH keys, AI tool credentials, git config, etc. are all
# available automatically. Only add overrides here for non-home-directory mounts
# or service-specific customizations.

services:
  frappe:
    volumes: []
      # Add any extra mounts not covered by the home directory mount, e.g.:
      # - /mnt/data:/data:cached
